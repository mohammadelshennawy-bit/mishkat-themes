name: Build Android APK
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Use fixed signing key (updates install over old version)
        env: {KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}'}
        run: |
          if [ -z "$KS" ]; then echo "::warning::ANDROID_DEBUG_KEYSTORE secret is missing - APK will use a temporary key"; exit 0; fi
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-}" "${ANDROID_PREFS_ROOT:-}"; do
            [ -n "$d" ] || continue; mkdir -p "$d"; echo "$KS" | base64 -d > "$d/debug.keystore"
          done
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | tail -2
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk mishkat-themes.apk
      - uses: actions/upload-artifact@v4
        with: {name: mishkat-themes-apk, path: mishkat-themes.apk}
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: mishkat-themes.apk}

